name: Where it runs

# Prints where her Supabase project runs (its region), to place the app's server functions beside it (decision 0077).
# Read-only: one GET to the Supabase Management API; it changes nothing. Run by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  where:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Her project's region
        run: |
          region=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects/iowwrmnfeaogocnspgvf | jq -r .region)
          echo "::notice title=Supabase region::$region"
      # Whether a session can be checked on the server without asking Supabase each time: it can when the project
      # signs sessions with an asymmetric key, which this public list then holds.
      - name: Her project's session signing keys
        run: |
          algs=$(curl -fsS https://iowwrmnfeaogocnspgvf.supabase.co/auth/v1/.well-known/jwks.json | jq -r '[.keys[].alg] | join(",")')
          echo "::notice title=Session signing keys::${algs:-none (a shared secret: every check asks Supabase)}"
