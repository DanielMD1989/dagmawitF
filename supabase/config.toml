# Local Supabase stack (`supabase start`). Hosted projects are configured in the dashboard;
# README.md lists the settings that must match this file.
project_id = "dagmawit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

# Catches any email locally (the app sends none: decision 0065).
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# One designer. New accounts are created by hand (dashboard: Authentication > Users > Add user),
# never by a visitor typing an email into the sign-in form.
enable_signup = false
enable_anonymous_sign_ins = false
# She signs in with her email and a password (decision 0065). The app asks for the same minimum
# (src/domain/passwords.ts); set it in her project's dashboard too.
minimum_password_length = 10

[auth.email]
# Despite its name, this switches signing in with an email address on or off altogether (the CLI passes it to the auth
# server as GOTRUE_EXTERNAL_EMAIL_ENABLED; supabase/cli#2053). It must stay true, or nobody can sign in. New accounts
# are kept out by `enable_signup = false` under [auth] above. A unit test holds both (src/supabase-config.test.ts).
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
