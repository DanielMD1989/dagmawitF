<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No signal · DAGMAWIT</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f6f2ea, #2a2723);
        --ink: light-dark(#25231f, #ece6d8);
        --muted: light-dark(#5c574d, #bdb6a6);
        --line: light-dark(#ddd4c3, #4b473f);
        --surface: light-dark(#fffdf8, #34312b);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 2rem;
        line-height: 1.1;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No signal</h1>
      <p>
        DAGMAWIT needs a connection to show your day. Nothing is lost. Try again when you are back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
